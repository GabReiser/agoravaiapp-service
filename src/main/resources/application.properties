# ============================================================
# Core Service (Quarkus) - configuracao base
# ============================================================
quarkus.application.name=core-service
quarkus.http.port=8082

# CORS alinhado ao Auth Service (frontend local + producao)
quarkus.http.cors.origins=http://localhost:8081,https://www.agoravaiapp.com
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept,Origin,X-User-Id,X-User-Admin
quarkus.http.cors.exposed-headers=Authorization

# ------------------------------------------------------------
# Datasource (PostgreSQL)
# ------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.default-schema=core
quarkus.hibernate-orm.log.sql=false

# ------------------------------------------------------------
# Flyway (schema "core" criado automaticamente)
# ------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=core
quarkus.flyway.create-schemas=true
quarkus.flyway.default-schema=core

# ------------------------------------------------------------
# Identidade do usuario
# O gateway valida o JWT e injeta X-User-Id / X-User-Admin.
# Em dev (sem gateway) usamos um usuario/administrador fixo.
# TODO(producao): validar o JWT Firebase no proprio core (quarkus-oidc).
# ------------------------------------------------------------
agoravai.auth.dev-user-id=dev-user
agoravai.auth.dev-admin=true

# ------------------------------------------------------------
# Redis (semi-implementado; NAO esta em uso por padrao)
# ------------------------------------------------------------
agoravai.redis.enabled=false

# ------------------------------------------------------------
# Observabilidade
# ------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.enabled=true

# ------------------------------------------------------------
# OpenAPI
# ------------------------------------------------------------
quarkus.smallrye-openapi.path=/q/openapi

# ============================================================
# Dev profile
# ============================================================
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/agoravai_core
%dev.quarkus.datasource.username=admin
%dev.quarkus.datasource.password=admin_password
%dev.quarkus.hibernate-orm.log.sql=true

# ============================================================
# Producao: valores via variaveis de ambiente (ex.: Kubernetes):
#   QUARKUS_DATASOURCE_JDBC_URL
#   QUARKUS_DATASOURCE_USERNAME
#   QUARKUS_DATASOURCE_PASSWORD
# ============================================================
