# ============================================================
# Core Service (Quarkus) - configuracao base
# ============================================================
quarkus.application.name=core-service
quarkus.http.port=8082
%dev.quarkus.http.port=8082

# CORS alinhado ao Auth Service (frontend local + producao).
# X-User-Id / X-User-Admin sairam da lista: o core nao le mais esses headers.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000,http://localhost:8081,https://www.agoravaiapp.com,https://agoravaiapp.com
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept,Origin,X-Request-Id
quarkus.http.cors.exposed-headers=Authorization,X-Request-Id

# ------------------------------------------------------------
# Identidade: validacao local do ID token do Firebase
#
# O core valida o token por conta propria em vez de confiar num header injetado
# por um gateway que ainda nao existe. Sem discovery document (o Firebase nao
# publica um), configuramos JWKS, issuer e audience na mao.
#
#   iss = https://securetoken.google.com/<project-id>
#   aud = <project-id>
#   sub = UID do Firebase  -> vira transactions.user_id
#
# As chaves publicas ficam em cache (smallrye.jwt.jwks.refresh-interval, em
# minutos), entao nao ha chamada ao Google por requisicao.
# ------------------------------------------------------------
agoravai.firebase.project-id=${FIREBASE_PROJECT_ID:agora-vai-7bf9e}

mp.jwt.verify.publickey.location=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
mp.jwt.verify.issuer=https://securetoken.google.com/${agoravai.firebase.project-id}
mp.jwt.verify.audiences=${agoravai.firebase.project-id}
smallrye.jwt.jwks.refresh-interval=60
# Necessario para buscar o JWKS por HTTPS na imagem nativa (Dockerfile.native).
quarkus.ssl.native=true

# Toda a API exige token. /q/* (health, metrics, openapi) fica publico para os
# probes do Kubernetes.
quarkus.http.auth.permission.api.paths=/api/v1/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.public.paths=/q/*
quarkus.http.auth.permission.public.policy=permit

# Ponte temporaria para o painel admin, enquanto o auth-service nao grava o
# custom claim "admin" via Firebase Admin SDK. Lista de UIDs do Firebase.
# Ex.: agoravai.auth.admin-uids=abc123,def456
# agoravai.auth.admin-uids=

# Fallback sem token: SOMENTE em dev (ver %dev abaixo). Em hom/prod fica false,
# e uma requisicao sem ID token valido recebe 401.
agoravai.auth.dev-fallback=false
agoravai.auth.dev-user-id=dev-user
agoravai.auth.dev-admin=false

# ------------------------------------------------------------
# Datasource (PostgreSQL)
# ------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.default-schema=core
quarkus.hibernate-orm.log.sql=false

# ------------------------------------------------------------
# Flyway (schema "core" criado automaticamente)
# ------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=core
quarkus.flyway.create-schemas=true
quarkus.flyway.default-schema=core

# ------------------------------------------------------------
# Redis (semi-implementado; NAO esta em uso por padrao)
# ------------------------------------------------------------
agoravai.redis.enabled=false

# ------------------------------------------------------------
# Observabilidade
# ------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.enabled=true

# ------------------------------------------------------------
# OpenAPI
# ------------------------------------------------------------
quarkus.smallrye-openapi.path=/q/openapi

# ============================================================
# Dev profile
# ============================================================
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/agoravai_core
%dev.quarkus.datasource.username=admin
%dev.quarkus.datasource.password=admin_password
%dev.quarkus.hibernate-orm.log.sql=true
# Permite exercitar a API com curl, sem token. O frontend em dev continua
# mandando um ID token real, e nesse caso o token tem precedencia.
%dev.agoravai.auth.dev-fallback=true
%dev.agoravai.auth.dev-admin=true
%dev.quarkus.http.auth.permission.api.policy=permit

# ============================================================
# Producao: valores via variaveis de ambiente (ex.: Kubernetes):
#   QUARKUS_DATASOURCE_JDBC_URL
#   QUARKUS_DATASOURCE_USERNAME
#   QUARKUS_DATASOURCE_PASSWORD
#   FIREBASE_PROJECT_ID
#   AGORAVAI_AUTH_ADMIN_UIDS
# ============================================================
