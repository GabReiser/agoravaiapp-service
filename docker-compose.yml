version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agoravai-core-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: agoravai_core
    ports:
      - "5434:5432"
    volumes:
      - core_postgres_data:/var/lib/postgresql/data

volumes:
  core_postgres_data:
