apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: ${NAMESPACE}
  labels:
    app: core-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      # Se a imagem no Docker Hub for privada, descomente e crie o secret:
      # imagePullSecrets:
      #   - name: docker-hub-credentials
      containers:
        - name: core-service
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            # Quarkus mapeia QUARKUS_DATASOURCE_* -> quarkus.datasource.*
            # Crie um Secret "core-service-db" em cada namespace com as chaves:
            # url, username, password.
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: core-service-db
                  key: url
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: core-service-db
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: core-service-db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Quarkus + smallrye-health expõe /q/health/started, /live e /ready.
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
